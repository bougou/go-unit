baseURL = "https://bougou.github.io/go-unit/"
title = "go-unit"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableEmoji = true
enableGitInfo = true

[languages.en]
locale = "en-us"
label = "English"
contentDir = "content/en"
weight = 1

[languages.zh]
locale = "zh-cn"
label = "中文"
contentDir = "content/zh"
weight = 2

[languages.zh.params]
  description = "面向 Go 的 SI 感知物理量、量纲、单位换算库"

[build]
  noJSConfigInAssets = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.140.0"
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[markup]
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 1
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

[params]
  description = "Physical quantities with SI-aware units, dimensions, and conversions for Go"
  google_fonts = [
    ["Inter", "300, 400, 600, 700"],
    ["Fira Code", "500, 700"],
  ]
  sans_serif_font = "Inter"
  secondary_font = "Inter"
  mono_font = "Fira Code"

  [params.footer]
    copyright = "© :YEAR: go-unit. Built with [Lotus Docs](https://github.com/colinwilson/lotusdocs)"
    version = true

  [params.social]
    github = "bougou/go-unit"

  [params.docs]
    title = "go-unit"
    darkMode = true
    prism = true
    repoURL = "https://github.com/bougou/go-unit"
    repoBranch = "units"
    editPage = true
    lastMod = true
    lastModRelative = true
    toc = true
    tocMobile = true
    scrollSpy = true
    sidebarIcons = true
    breadcrumbs = true
    navDesc = true
    descriptions = true
    backToTop = true

  [params.flexsearch]
    enabled = true

[[languages.en.menu.primary]]
  name = "Docs"
  url = "/docs/"
  identifier = "docs"
  weight = 10

[[languages.zh.menu.primary]]
  name = "文档"
  url = "/docs/"
  identifier = "docs"
  weight = 10
